<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; font-family:"宋体",SimSun,sans-serif; background:#e4e4e4; overflow:hidden; position:relative; }
  .wrap { display:flex; height:100%; align-items:center; padding:0 70px; gap:60px; }
  .left { flex:1; }
  .tag { display:inline-block; background:#4c95e7; color:#fff; font-size:20px; padding:4px 14px; letter-spacing:2px; }
  h1 { font-size:96px; letter-spacing:14px; color:#111; margin:26px 0 10px; font-weight:700; }
  h1 small { font-size:26px; letter-spacing:2px; color:#4c95e7; font-weight:400; display:block; margin-top:6px; }
  .sub { font-size:24px; color:#555; margin:8px 0 26px; letter-spacing:1px; }
  .list { font-size:22px; color:#333; line-height:2; letter-spacing:2px; }
  .list b { color:#c0392b; font-weight:400; }
  .url { margin-top:30px; font-size:24px; color:#004299; letter-spacing:1px; }
  .url u { text-decoration:none; border-bottom:2px solid #004299; }
  .phone { flex:none; border:3px solid #333; box-shadow:0 0 0 6px #d6d6d6; }
  .phone img { display:block; width:295px; height:524px; image-rendering:pixelated; }
  .corner { position:absolute; right:18px; bottom:12px; font-size:16px; color:#999; letter-spacing:2px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="left">
    <span class="tag">3GQQ · 2008—2015</span>
    <h1>QQ家园<small>像素复刻 · 点开就能玩</small></h1>
    <div class="sub">那个只有按键机才懂的绿色 WAP 社区，回来了。</div>
    <div class="list">
      <b>■</b> 魔法花园 —— 种花 偷花 点亮花谱<br>
      <b>■</b> 阳光牧场 —— 定闹钟也要收的菜<br>
      <b>■</b> 精武堂 —— 文字比武 二力一敏<br>
      <b>■</b> 全服排行 —— 等级 比武 收花<br>
      <b>■</b> 跨服偷菜 —— 偷的全是活人
    </div>
    <div class="url">链接在主页 · 复制到浏览器直接玩</div>
  </div>
  <div class="phone"><img src="shot-home.png" alt=""></div>
</div>
<div class="corner">宋体12px · 1px边框 · 极速模式 · 完整复刻</div>
</body>
</html>

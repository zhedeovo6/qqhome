<!DOCTYPE html>

  .list b { color:#c0392b; font-weight:400; }
  .url { margin-top:22px; background:#fff9b7; border:1px solid #e6d68a; padding:12px 30px; font-size:32px; color:#004299; letter-spacing:2px; }
